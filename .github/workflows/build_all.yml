name: Build All Platforms

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android-web-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android AppBundle
        run: flutter build appbundle --release

      - name: Build Web
        run: flutter build web --release

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Build Linux
        run: flutter build linux --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/**

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/**

      - name: Upload Android AppBundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer
        run: iscc installer.iss

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: build/HabitLoopSetup.exe

  build-macos-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/macos/**

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/**

  create_release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs:
      - build-android-web-linux
      - build-windows
      - build-macos-ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: artifacts/windows

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: artifacts/web

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: artifacts/ios

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/android/*.apk release-assets/HabitLoop-Android.apk
          cp artifacts/windows/HabitLoopSetup.exe release-assets/HabitLoop-Windows-Setup.exe
          tar -czf release-assets/HabitLoop-Web.tar.gz -C artifacts/web .
          tar -czf release-assets/HabitLoop-iOS.tar.gz -C artifacts/ios .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: HabitLoop Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            release-assets/HabitLoop-Android.apk
            release-assets/HabitLoop-Windows-Setup.exe
            release-assets/HabitLoop-Web.tar.gz
            release-assets/HabitLoop-iOS.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
